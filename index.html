<!-- =====================================================

===================================================== -->

<div class="roshish-ai">

    <button
        class="ai-toggle"
        onclick="toggleRoshishAI()"
    >
        🤖 Roshish AI
    </button>

    <div
        class="ai-box"
        id="roshishAIBox"
    >

        <div class="ai-header">

            <div>
                <strong>🤖 Roshish AI</strong>
                <small>Smart Website Assistant</small>
            </div>

            <button
                onclick="toggleRoshishAI()"
                class="ai-close"
            >
                ✕
            </button>

        </div>

        <div
            class="ai-messages"
            id="roshishAIMessages"
        >

            <div class="ai-message bot">

                👋 Hi! I'm <b>Roshish AI</b>.

                <br><br>

                Ask me about Roshish, his services,
                website, pricing, contact or technology.

            </div>

        </div>

        <div class="ai-quick">

            <button onclick="askRoshishAI('Who is Roshish Nepal?')">
                Who is Roshish?
            </button>

            <button onclick="askRoshishAI('What services do you provide?')">
                Services
            </button>

            <button onclick="askRoshishAI('How can I contact Roshish?')">
                Contact
            </button>

        </div>

        <div class="ai-input">

            <input
                type="text"
                id="roshishAIInput"
                placeholder="Ask Roshish AI..."
                autocomplete="off"
                onkeydown="
                if(event.key==='Enter'){
                    sendRoshishAI();
                }
                "
            >

            <button
                onclick="sendRoshishAI()"
                aria-label="Send"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<style>

/* =====================================================
   ROSHISH AI DESIGN
===================================================== */

.roshish-ai{

    position:fixed;

    right:25px;
    bottom:25px;

    z-index:99990;

    font-family:inherit;

}

.ai-toggle{

    border:none;

    padding:14px 20px;

    border-radius:50px;

    cursor:pointer;

    font-weight:900;

    font-size:14px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple)
        );

    box-shadow:
        0 10px 35px rgba(0,0,0,.35),
        0 0 25px rgba(0,229,255,.15);

    transition:.3s;

}

.ai-toggle:hover{

    transform:
        translateY(-4px)
        scale(1.03);

}


/* CHAT BOX */

.ai-box{

    position:absolute;

    right:0;
    bottom:65px;

    width:370px;
    height:540px;

    display:none;
    flex-direction:column;

    overflow:hidden;

    border-radius:24px;

    background:
        rgba(10,10,18,.96);

    color:var(--text);

    border:
        1px solid var(--border);

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);

    backdrop-filter:blur(25px);

}

body.light-theme .ai-box{

    background:
        rgba(255,255,255,.97);

}


/* ACTIVE */

.ai-box.active{

    display:flex;

}


/* HEADER */

.ai-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:17px 18px;

    background:
        linear-gradient(
            135deg,
            rgba(0,229,255,.14),
            rgba(139,92,246,.16)
        );

    border-bottom:
        1px solid var(--border);

}

.ai-header strong{

    display:block;

    font-size:16px;

}

.ai-header small{

    display:block;

    margin-top:3px;

    color:var(--muted);

    font-size:11px;

}

.ai-close{

    border:none;

    background:transparent;

    color:var(--text);

    cursor:pointer;

    font-size:18px;

}


/* MESSAGES */

.ai-messages{

    flex:1;

    overflow-y:auto;

    padding:16px;

    scrollbar-width:thin;

}

.ai-message{

    max-width:85%;

    padding:12px 14px;

    margin-bottom:12px;

    border-radius:16px;

    font-size:13px;

    line-height:1.6;

    word-wrap:break-word;

}

.ai-message.bot{

    margin-right:auto;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid var(--border);

}

body.light-theme .ai-message.bot{

    background:
        rgba(0,0,0,.045);

}

.ai-message.user{

    margin-left:auto;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple)
        );

}


/* QUICK BUTTONS */

.ai-quick{

    display:flex;

    gap:7px;

    padding:8px 10px;

    overflow-x:auto;

    border-top:
        1px solid var(--border);

}

.ai-quick button{

    white-space:nowrap;

    padding:7px 11px;

    border-radius:20px;

    border:
        1px solid var(--border);

    background:
        var(--card);

    color:var(--text);

    cursor:pointer;

    font-size:11px;

}

.ai-quick button:hover{

    border-color:var(--cyan);

    color:var(--cyan);

}


/* INPUT */

.ai-input{

    display:flex;

    gap:8px;

    padding:11px;

    border-top:
        1px solid var(--border);

}

.ai-input input{

    flex:1;

    min-width:0;

    padding:12px 15px;

    border-radius:25px;

    border:
        1px solid var(--border);

    background:
        var(--card);

    color:var(--text);

    outline:none;

    font-family:inherit;

}

.ai-input input:focus{

    border-color:var(--cyan);

}

.ai-input button{

    width:45px;
    height:45px;

    flex-shrink:0;

    border:none;

    border-radius:50%;

    cursor:pointer;

    color:#fff;

    font-size:18px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple)
        );

}


/* MOBILE */

@media(max-width:600px){

    .roshish-ai{

        right:15px;
        bottom:15px;

    }

    .ai-box{

        width:
            calc(100vw - 30px);

        height:
            min(70vh,540px);

        right:0;

    }

    .ai-toggle{

        padding:12px 16px;

    }

</style>


<script>

/* =====================================================
   ROSHISH AI ENGINE
===================================================== */


/* OPEN / CLOSE */

function toggleRoshishAI(){

    const box =
        document.getElementById(
            "roshishAIBox"
        );

    box.classList.toggle("active");

}


/* ADD MESSAGE */

function addRoshishMessage(
    message,
    type
){

    const messages =
        document.getElementById(
            "roshishAIMessages"
        );

    const div =
        document.createElement("div");

    div.className =
        "ai-message " + type;

    div.innerHTML =
        message;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;

}


/* SEND MESSAGE */

function sendRoshishAI(){

    const input =
        document.getElementById(
            "roshishAIInput"
        );

    const question =
        input.value.trim();

    if(!question) return;


    addRoshishMessage(
        escapeAIText(question),
        "user"
    );

    input.value="";


    /* Small thinking delay */

    setTimeout(function(){

        const answer =
            getRoshishAIAnswer(question);

        addRoshishMessage(
            answer,
            "bot"
        );

    },450);

}


/* QUICK QUESTION */

function askRoshishAI(question){

    const input =
        document.getElementById(
            "roshishAIInput"
        );

    input.value =
        question;

    sendRoshishAI();

}


/* SAFE USER TEXT */

function escapeAIText(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ROSHISH AI KNOWLEDGE
===================================================== */

function getRoshishAIAnswer(question){

    const q =
        question
        .toLowerCase()
        .trim();


    /* GREETING */

    if(
        q.includes("hello") ||
        q.includes("hi") ||
        q.includes("hey") ||
        q.includes("namaste") ||
        q.includes("नमस्ते")
    ){

        return `
        👋 Hello!

        <br><br>

        Welcome to <b>Roshish Nepal</b>.

        <br><br>

        I'm <b>Roshish AI</b>.
        Ask me anything about Roshish,
        his services or this website.
        `;

    }


    /* WHO IS ROSHISH */

    if(
        q.includes("who is roshish") ||
        q.includes("who is roshish nepal") ||
        q.includes("roshish ko ho") ||
        q.includes("रोशिश को हो")
    ){

        return `
        👤 <b>Roshish Nepal</b> is a
        Creator & Developer.

        <br><br>

        He creates modern websites,
        creative digital projects,
        designs and technology-based
        experiences.
        `;

    }


    /* SERVICES */

    if(
        q.includes("service") ||
        q.includes("services") ||
        q.includes("what do you do") ||
        q.includes("what can you do") ||
        q.includes("काम") ||
        q.includes("सेवा")
    ){

        return `
        💼 <b>Roshish's Services</b>

        <br><br>

        🌐 Website Development<br>
        💻 HTML / CSS / JavaScript<br>
        🎨 Logo & Graphic Design<br>
        📱 Social Media Posters<br>
        🎬 Video Editing<br>
        🏢 Business Websites<br>
        🏫 School / College Websites<br>
        👤 Portfolio Websites<br>
        🍽️ Restaurant Websites

        <br><br>

        💰 Starting from
        <b>NPR 5,000</b>.
        `;

    }


    /* PRICE */

    if(
        q.includes("price") ||
        q.includes("pricing") ||
        q.includes("cost") ||
        q.includes("how much") ||
        q.includes("कति") ||
        q.includes("पैसा")
    ){

        return `
        💰 <b>Starting Price</b>

        <br><br>

        Services start from
        <b>NPR 5,000</b>.

        <br><br>

        The final price can depend on
        the project's requirements,
        features and complexity.

        <br><br>

        You can use the
        <b>Hire Me</b> section
        to send a project request.
        `;

    }


    /* WEBSITE */

    if(
        q.includes("website") ||
        q.includes("web development") ||
        q.includes("web design")
    ){

        return `
        🌐 Roshish creates modern,
        responsive websites.

        <br><br>

        Websites can include:

        <br><br>

        • Responsive design<br>
        • Animations<br>
        • Dark / Light mode<br>
        • Interactive features<br>
        • Portfolio sections<br>
        • Contact sections<br>
        • Custom layouts

        <br><br>

        Website projects start from
        <b>NPR 5,000</b>.
        `;

    }


    /* HTML */

    if(
        q.includes("html")
    ){

        return `
        💻 <b>HTML</b> stands for
        HyperText Markup Language.

        <br><br>

        It is used to structure
        content on websites such as
        headings, paragraphs, images,
        links and forms.
        `;

    }


    /* CSS */

    if(
        q.includes("css")
    ){

        return `
        🎨 <b>CSS</b> stands for
        Cascading Style Sheets.

        <br><br>

        CSS controls the visual
        appearance of websites,
        including layouts, colors,
        spacing, animations and
        responsive design.
        `;

    }


    /* JAVASCRIPT */

    if(
        q.includes("javascript") ||
        q === "js"
    ){

        return `
        ⚡ <b>JavaScript</b> is a
        programming language commonly
        used to make websites interactive.

        <br><br>

        It can control buttons,
        animations, forms, menus,
        timers and many other
        interactive features.
        `;

    }


    /* CONTACT */

    if(
        q.includes("contact") ||
        q.includes("phone") ||
        q.includes("email") ||
        q.includes("hire") ||
        q.includes("reach")
    ){

        return `
        📩 <b>Contact Roshish</b>

        <br><br>

        📧 Email:<br>
        roshishnepal73@gmail.com

        <br><br>

        📱 Phone:<br>
        9862511510

        <br><br>

        You can also use the
        <b>Hire Me</b> section
        on this website.
        `;

    /* FACEBOOK */

    if(

        on Facebook.

        <br><br>

        Use the Facebook icon
        in the Contact section
        to visit the profile.
        `;

    }


    /* GITHUB */

    if(
        q.includes("github") ||
        q.includes("code")
    ){

        return `
        💻 Roshish uses GitHub
        for development projects.

        <br><br>

        You can visit the GitHub
        link from the Contact section
        of this website.

    }


    /* ABOUT WEBSITE */

    if(
        q.includes("this website") ||

        q.includes("portfolio")
    ){

        return `
        🚀 This is the personal portfolio

    }


    /* SKILLS */

    if(
        q.includes("skill") ||
        q.includes("skills")
    ){

        return `
        🧠 <b>Roshish's Skills</b>

        <br><br>

        💻 Web Development — 95%<br>
        🎨 Creative Design — 90%<br>

    /* PROJECTS */

    if(
        q.includes("project") ||

    ){

        return `

        <br><br>

        <br><br>

        Check the
        <b>Projects</b> section
        to explore them.
        `;

    }


    /* DASHain */

    if(
        q.includes("dashain") ||
        q.includes("दशैं")
    ){

        return `

        Dashain countdown and

        `;

    }


    /* MUSIC */

    if(
        q.includes("music") ||
        q.includes("mangal dhun") ||
        q.includes("धुन")
    ){

        return `
        🎵 The website has a
        <b>Mangal Dhun</b> player.

        <br><br>

        Go to the
        <b>Live Tools</b> section
        and press
        <b>Play Mangal Dhun</b>.
        `;

    }


    /* DARK MODE */

    if(
        q.includes("dark mode") ||
        q.includes("light mode") ||
        q.includes("theme")
    ){

        return `
        🌙☀️ This website supports
        both <b>Dark Mode</b> and
        <b>Light Mode</b>.

        Use the theme switch
        at the top-right of the
        navigation bar.
        `;

    }


    /* HIRE */

    if(
        q.includes("hire me") ||
        q.includes("hire you") ||
        q.includes("want to hire")
    ){

        return `
        💼 Want to hire Roshish?

        <br><br>

        Go to the
        <b>Hire Me</b> section,
        select your service and
        describe your project.

        <br><br>

        💰 Services start from
        <b>NPR 5,000</b>.
        `;

    }


    /* THANK YOU */

    if(
        q.includes("thank") ||
        q.includes("thanks") ||
        q.includes("धन्यवाद")
    ){

        return `
        😊 You're welcome!

        <br><br>

        Feel free to ask me
        another question.
        `;

    }


    /* HELP */

    if(
        q.includes("help") ||
        q.includes("what can i ask") ||
        q.includes("what can you answer")
    ){

        return `
        🤖 You can ask me:

        <br><br>

        • Who is Roshish?<br>
        • What services are available?<br>
        • How much does a website cost?<br>
        • How can I contact Roshish?<br>
        • What is HTML?<br>
        • What is CSS?<br>
        • What is JavaScript?<br>
        • What projects has Roshish made?<br>
        • How does this website work?<br>
        • Tell me about Dashain<br>
        • How do I hire Roshish?

        <br><br>

        Just type your question below.
        `;

    }


    /* DEFAULT */

    return `
    🤔 I'm currently the
    <b>API-free version of Roshish AI</b>.

    <br><br>

    I can answer questions about
    <b>Roshish, his services,
    projects, skills, pricing,
    contact and this website</b>.

    <br><br>

    Try asking:
    <br>
    <i>"Who is Roshish?"</i>
    <br>

    `;

}

</script>
